# CI (T-023): lint → typecheck → build → (PostGIS·Redis 서비스) migrate → seed → test
# 비밀값을 쓰지 않는다. env는 모두 명백한 테스트 값이고, 외부 provider 호출·실제 푸시·배포는 없다.
# 로컬과 같은 이미지·버전·포트 (docker-compose.yml, .env.example).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # postgis/postgis 공식 이미지와 같은 관리자의 멀티 아키텍처 빌드 (docker-compose.yml과 동일)
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: berun
          POSTGRES_PASSWORD: berun
          POSTGRES_DB: berun
          TZ: UTC
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U berun -d berun"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://berun:berun@localhost:55432/berun
      TEST_DATABASE_URL: postgres://berun:berun@localhost:55432/berun_test
      REDIS_URL: redis://localhost:56379
      TEST_REDIS_URL: redis://localhost:56379/1
      # 워커 코드가 실수로 실행돼도 외부로 나가지 않게
      PUSH_DRY_RUN: 'true'
      UNLINK_DRY_RUN: 'true'

    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager(pnpm@10.34.7)를 쓴다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # docker-compose의 초기화 스크립트(docker/postgres/init)와 같은 역할
      - name: Create test database
        run: docker exec ${{ job.services.postgres.id }} psql -U berun -d berun -c "CREATE DATABASE berun_test OWNER berun"

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      # 통합 테스트는 berun_test를 비우고 마이그레이션을 처음부터 다시 적용한다 (server/test/global-setup.ts)
      - name: Test
        run: pnpm test
